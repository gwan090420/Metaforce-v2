<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TFT AI Coach</title>

<style>
body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: linear-gradient(135deg, #0f0f0f, #1a1a1a);
    color: white;
}

.hero {
    position: relative;
    text-align: center;
}

.hero img {
    width: 100%;
    opacity: 0.85;
}

.hero h1 {
    position: absolute;
    top: 40%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 36px;
    letter-spacing: 2px;
}

.container {
    padding: 20px;
}

.card {
    background: rgba(255,255,255,0.05);
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 20px;
    backdrop-filter: blur(15px);
    transition: 0.3s;
}

.card:hover {
    background: rgba(0,255,200,0.1);
}

button {
    width: 100%;
    padding: 12px;
    border-radius: 12px;
    border: none;
    background: #00ffc3;
    font-weight: bold;
    margin-top: 10px;
}

.hidden {
    display: none;
}

footer {
    text-align:center;
    font-size:12px;
    padding:20px;
    opacity:0.5;
}
</style>
</head>

<body>

<div class="hero">
    <img src="banner.png">
</div>

<div class="container">

    <div class="card">
        <h3>🔥 S급 조합</h3>
        <button onclick="toggle('meta')">자세히 보기</button>
        <div id="meta" class="hidden">
            <p>핵심 유닛: 입력</p>
            <p>필수 아이템: 입력</p>
            <p>추천 증강: 입력</p>
        </div>
    </div>

    <div class="card">
        <h3>📷 스크린샷 분석 (준비중)</h3>
        <button>곧 추가됩니다</button>
    </div>

</div>

<footer>
This is an unofficial fan-made tool and is not affiliated with Riot Games.
</footer>

<script>
function toggle(id) {
    var element = document.getElementById(id);
    element.classList.toggle("hidden");
}
</script>

</body>
</html>
